<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTV Les-Architect | Casus Gyroscoopweg</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --police-blue: #00447c;
            --police-gold: #ffcc00;
            --bg-light: #f4f4f4;
            --bg-dark: #1a1a1a;
            --text-light: #ffffff;
            --text-dark: #333333;
        }

        body { font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Navigatie */
        nav { background: var(--police-blue); padding: 10px; display: flex; gap: 10px; border-bottom: 3px solid var(--police-gold); }
        nav button { padding: 10px 20px; cursor: pointer; border: none; font-weight: bold; text-transform: uppercase; }
        .btn-docent { background: var(--bg-dark); color: white; }
        .btn-student { background: white; color: var(--police-blue); }

        /* Secties */
        .view { display: none; flex: 1; overflow: hidden; }
        .active { display: flex; }

        /* Docent Dashboard - Dark Mode */
        #docent-view { background: var(--bg-dark); color: var(--text-light); flex-direction: column; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; height: 100%; }
        .config-panel, .monitor-panel { background: #2a2a2a; padding: 15px; border-radius: 5px; border: 1px solid #444; }
        
        /* Student Matrix - Light Mode */
        #student-view { background: var(--bg-light); color: var(--text-dark); flex-direction: row; padding: 20px; gap: 20px; }
        .chat-container { flex: 1; background: white; display: flex; flex-direction: column; border: 2px solid var(--police-blue); }
        .pv-container { flex: 1; display: flex; flex-direction: column; }
        
        textarea { width: 100%; height: 200px; margin-top: 10px; resize: none; border: 1px solid #ccc; font-family: 'Courier New', monospace; padding: 10px; }
        #feedback-area { background: #fffde7; border: 2px solid #fdd835; padding: 10px; height: 80px; overflow-y: auto; margin-bottom: 10px; font-weight: bold; }
        .new-feedback { animation: flash 1s infinite; }
        @keyframes flash { 0% { background: #fffde7; } 50% { background: #ffeb3b; } 100% { background: #fffde7; } }

        /* Algemeen */
        h2 { border-bottom: 2px solid var(--police-gold); padding-bottom: 5px; margin-top: 0; }
        button.action-btn { background: var(--police-blue); color: white; border: none; padding: 10px; cursor: pointer; width: 100%; }
        .status-bar { font-size: 0.8em; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<nav>
    <button class="btn-docent" onclick="switchView('docent-view')">Docenten Dashboard</button>
    <button class="btn-student" onclick="switchView('student-view')">Studenten Matrix</button>
</nav>

<div id="docent-view" class="view">
    <div class="dashboard-grid">
        <div class="config-panel">
            <h2>Configuratie</h2>
            <label>Casus: Verlaten Plaats Ongeval (Art. 7 WVW)</label><br><br>
            <label>Prompt Aanpassing Burger:</label>
            <select id="burger-mood" style="width:100%; padding:5px; margin: 10px 0;">
                <option value="Behulpzaam en zakelijk">Behulpzaam en zakelijk</option>
                <option value="Emotioneel en overstuur">Emotioneel en overstuur</option>
                <option value="Geïrriteerd door de situatie">Geïrriteerd door de situatie</option>
            </select>
            <button class="action-btn" onclick="updateBurger()">Update Burger AI</button>
            <hr>
            <button style="background: #a00;" class="action-btn" onclick="resetSessie()">RESET VOLLEDIGE SESSIE</button>
        </div>
        <div class="monitor-panel">
            <h2>Live Monitor PV</h2>
            <div id="live-monitor" style="background: #000; padding:10px; height: 300px; overflow-y: auto;">
                Wachten op input student...
            </div>
            <div style="margin-top:10px;">
                <input type="text" id="feedback-input" placeholder="Feedback voor student..." style="width: 70%; padding: 10px;">
                <button onclick="sendFeedback()" style="width: 25%; padding: 10px; background: var(--police-gold); color: black; border:none; font-weight:bold;">Verstuur</button>
            </div>
        </div>
    </div>
</div>

<div id="student-view" class="view">
    <div class="chat-container">
        <div style="background: var(--police-blue); color: white; padding: 10px; font-weight: bold;">DE BALIE - Mevrouw Jansen (Aangever)</div>
        <div id="chat-messages" style="flex:1; overflow-y: auto; padding: 10px;"></div>
        <div style="padding: 10px; border-top: 1px solid #ddd;">
            <input type="text" id="student-msg" placeholder="Stel een vraag aan de burger..." style="width: 80%; padding: 10px;">
            <button onclick="sendMessage()" style="padding: 10px;">Vraag</button>
        </div>
    </div>
    
    <div class="pv-container">
        <div id="feedback-area">Geen actuele feedback van docent.</div>
        <div style="background: #ddd; padding: 10px; font-weight: bold;">PV VAN BEVINDINGEN / AANGIFTE</div>
        <textarea id="pv-tekst" oninput="syncPV()" placeholder="Begin hier met het typen van je proces-verbaal..."></textarea>
        <div class="status-bar">Wetsartikel: Art. 7 Wegenverkeerswet | Locatie: Gyroscoopweg, Amsterdam</div>
    </div>
</div>

<script>
    // FIREBASE CONFIGURATIE
    const firebaseConfig = {
        apiKey: "AIzaSyBEod8zm1jvvkmPbe6cA_SQo2U_esC9yTY",
        databaseURL: "https://aangiftebotje-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // CASUS DATA
    const burgerData = {
        naam: "Mevrouw Jansen",
        auto: "Grijze Volkswagen Golf",
        daderAuto: "Donkerblauwe BMW 3-serie",
        daderSignalement: "Man, ongeveer 30-35 jaar, kort zwart haar, droeg een felrood sportjack.",
        promptBase: `Jij bent Mevrouw Jansen. Je doet aangifte van het verlaten van een plaats ongeval. 
        Locatie: Gyroscoopweg, Amsterdam (voorrangsweg bij bord B1). 
        Situatie: Jij reed 40 km/u, dader kwam uit de Deccaweg, gaf richting aan, maar verleende geen voorrang. 
        Botsing: Rechtervoorkant van jouw Golf tegen linkervoorkant van zijn BMW. 
        Gedrag dader: Stapte uit, keek naar schade, stapte plots weer in en reed weg richting Radarweg.`
    };

    // UI FUNCTIES
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    // FIREBASE SYNC
    function syncPV() {
        const text = document.getElementById('pv-tekst').value;
        db.ref('sessie/student_1/pv').set(text);
    }

    function sendFeedback() {
        const fb = document.getElementById('feedback-input').value;
        db.ref('sessie/student_1/feedback').set({
            msg: fb,
            timestamp: Date.now()
        });
        document.getElementById('feedback-input').value = '';
    }

    function updateBurger() {
        const mood = document.getElementById('burger-mood').value;
        db.ref('sessie/config/mood').set(mood);
        alert('Burger aangepast naar: ' + mood);
    }

    function resetSessie() {
        if(confirm("Weet u zeker dat u alle data wilt wissen?")) {
            db.ref('sessie').set({
                student_1: { pv: "", feedback: { msg: "Sessie gestart", timestamp: 0 } },
                config: { mood: "Behulpzaam en zakelijk" }
            });
            location.reload();
        }
    }

    // LIVE LISTENERS
    db.ref('sessie/student_1/pv').on('value', (snapshot) => {
        const val = snapshot.val();
        document.getElementById('live-monitor').innerText = val || "Student is nog niet begonnen...";
    });

    db.ref('sessie/student_1/feedback').on('value', (snapshot) => {
        const val = snapshot.val();
        if(val) {
            const fArea = document.getElementById('feedback-area');
            fArea.innerText = "DOCENT: " + val.msg;
            fArea.classList.add('new-feedback');
            setTimeout(() => fArea.classList.remove('new-feedback'), 5000);
        }
    });

    // SIMULATIE CHATBOT (Eenvoudig voor demo-code)
    function sendMessage() {
        const input = document.getElementById('student-msg');
        const chat = document.getElementById('chat-messages');
        if(!input.value) return;

        chat.innerHTML += `<div><b>Student:</b> ${input.value}</div>`;
        
        // Simpele logica gebaseerd op de casus
        let antwoord = "Dat weet ik niet meer precies, ik was nogal in de war.";
        const vraag = input.value.toLowerCase();
        
        if(vraag.includes("auto")) antwoord = `Ik reed in mijn grijze Volkswagen Golf en hij in een donkerblauwe BMW.`;
        if(vraag.includes("gebeurd")) antwoord = `Ik reed op de Gyroscoopweg en kreeg geen voorrang van die man die uit de Deccaweg kwam.`;
        if(vraag.includes("signalement") || vraag.includes("man")) antwoord = `Het was een man van rond de 30-35 jaar met kort zwart haar en een felrood sportjack.`;
        if(vraag.includes("schade")) antwoord = `Mijn rechter voorkant ligt helemaal in de kreukels.`;

        setTimeout(() => {
            chat.innerHTML += `<div style="color:var(--police-blue)"><b>Mevrouw Jansen:</b> ${antwoord}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 1000);

        input.value = '';
    }
</script>

</body>
</html>
